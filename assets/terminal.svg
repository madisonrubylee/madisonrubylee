<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 82px;
      font-weight: 700;
      letter-spacing: -5px;
      fill: #111111;
    }

    .role {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
      fill: #111111;
    }

    .small {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.4px;
      fill: #6F6F6F;
    }

    .accent {
      animation: slide 4.5s ease-in-out infinite;
    }

    .cursor {
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes slide {
      0%, 100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(54px);
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (prefers-color-scheme: dark) {
      .background {
        fill: #111111;
      }

      .name,
      .role {
        fill: #F4F4F4;
      }

      .small {
        fill: #888888;
      }

      .border {
        stroke: #303030;
      }
    }
  </style>

  <rect
    class="background"
    width="900"
    height="300"
    fill="#FFFFFF"
  />

  <rect
    class="border"
    x="0.5"
    y="0.5"
    width="899"
    height="299"
    stroke="#E2E2E2"
  />

  <text x="42" y="109" class="name">
    Chloe<tspan class="cursor" fill="#D84343">.</tspan>
  </text>

  <text x="46" y="148" class="role">
    Frontend Developer
  </text>

  <text x="46" y="237" class="small">
    React / TypeScript / Next.js
  </text>

  <text x="46" y="260" class="small">
    Seoul — eBay Japan
  </text>

  <text
    x="836"
    y="40"
    text-anchor="end"
    class="small"
  >
    2026
  </text>

  <text
    x="836"
    y="262"
    text-anchor="end"
    class="small"
  >
    37.5665 N
  </text>

  <g class="accent">
    <rect
      x="662"
      y="102"
      width="112"
      height="112"
      fill="#D84343"
    />
  </g>

  <rect
    x="695"
    y="135"
    width="112"
    height="112"
    fill="none"
    stroke="#111111"
  />
</svg>
