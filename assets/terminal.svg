<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .bg {
      fill: #FFFFFF;
    }

    .name {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 92px;
      font-weight: 700;
      letter-spacing: -6px;
      fill: #111111;
    }

    .role {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.3px;
      fill: #111111;
    }

    .meta {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.2px;
      fill: #777777;
    }

    .line {
      stroke: #111111;
      stroke-width: 1;
    }

    @media (prefers-color-scheme: dark) {
      .bg {
        fill: #0D0D0D;
      }

      .name,
      .role {
        fill: #F2F2F2;
      }

      .meta {
        fill: #777777;
      }

      .line {
        stroke: #F2F2F2;
      }
    }
  </style>

  <rect class="bg" width="900" height="300" />

  <text x="42" y="120" class="name">Chloe.</text>

  <text x="46" y="158" class="role">
    Frontend Developer
  </text>

  <line
    x1="46"
    y1="196"
    x2="854"
    y2="196"
    class="line"
  />

  <text x="46" y="229" class="meta">
    React · TypeScript · Next.js
  </text>

  <text
    x="854"
    y="229"
    text-anchor="end"
    class="meta"
  >
    Seoul / eBay Japan
  </text>
</svg>
